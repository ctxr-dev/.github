<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 380" role="img" aria-label="Contexter: composable tools for AI coding agents" preserveAspectRatio="xMidYMid meet">
  <title>Contexter: composable tools for AI coding agents</title>
  <defs>
    <style><![CDATA[
      .bg { fill: #06070D; }
      .edge { stroke: #A78BFA; stroke-opacity: 0.18; stroke-width: 1; fill: none; }
      .edge-strong { stroke: #A78BFA; stroke-opacity: 0.42; stroke-width: 1.1; fill: none; stroke-dasharray: 3 4; }
      .hud { stroke: #22D3EE; stroke-opacity: 0.55; stroke-width: 1.2; fill: none; }
      .rule { stroke: #22D3EE; stroke-opacity: 0.16; stroke-width: 0.6; }
      .node { fill: #06070D; stroke: #A78BFA; stroke-width: 1.6; }
      .msg { fill: #22D3EE; }
      .eyebrow {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 9.5px; letter-spacing: 0.22em; fill: #22D3EE;
      }
      .meta {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 9.5px; letter-spacing: 0.18em; fill: #475569;
      }
      .stats {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 11px; letter-spacing: 0.24em; fill: #64748B;
      }
      .title {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 80px; font-weight: 700; letter-spacing: -0.05em;
      }
      .subtitle {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 13.5px; font-weight: 500; fill: #94A3B8; letter-spacing: 0.32em;
      }
      .term {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 14px; letter-spacing: 0.02em;
      }
      /* Slower, gentler node pulse (was 3.4s, now 6s) for calmer motion. */
      .node { transform-box: fill-box; transform-origin: center; animation: nodePulse 6s ease-in-out infinite; }
      @keyframes nodePulse {
        0%, 100% { stroke-opacity: 0.38; }
        50%      { stroke-opacity: 0.95; }
      }
      .n1{animation-delay:0.0s}.n2{animation-delay:0.5s}.n3{animation-delay:1.0s}
      .n4{animation-delay:1.5s}.n5{animation-delay:2.0s}.n6{animation-delay:2.5s}
      .n7{animation-delay:3.0s}.n8{animation-delay:3.5s}.n9{animation-delay:4.0s}
      .n10{animation-delay:4.5s}.n11{animation-delay:5.0s}.n12{animation-delay:5.5s}
      @media (prefers-reduced-motion: reduce) { .node { animation: none; } }
    ]]></style>

    <!-- CRT scanlines: horizontal cyan hairlines at 4px intervals.
         Replaces the grid pattern, more cyberpunk, completely static. -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#22D3EE" stroke-opacity="0.045" stroke-width="0.8"/>
    </pattern>

    <!-- Mesh atmosphere -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#7C3AED" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cornerCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cornerAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottomGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>

    <!-- CRT corner vignettes: darken the four corners slightly so the eye lands centre. -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <!-- Neon glow filter for the wordmark. Standard SVG neon recipe:
         alpha-blur the source, flood-fill cyan, composite, merge under original. -->
    <filter id="neonGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.5" result="blur"/>
      <feFlood flood-color="#22D3EE" flood-opacity="0.55" result="cyanFlood"/>
      <feComposite in="cyanFlood" in2="blur" operator="in" result="cyanBlur"/>
      <feMerge>
        <feMergeNode in="cyanBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Typing clipPaths. rect.x must match the suffix text.x (135) so the visible window grows from the suffix start. -->
    <clipPath id="typeP1" clipPathUnits="userSpaceOnUse"><rect x="135" y="-16" width="0" height="22">
      <animate attributeName="width" dur="15s" repeatCount="indefinite"
        values="0;270;270;0;0;0"
        keyTimes="0;0.080;0.147;0.187;0.200;1"/>
    </rect></clipPath>
    <clipPath id="typeP2" clipPathUnits="userSpaceOnUse"><rect x="135" y="-16" width="0" height="22">
      <animate attributeName="width" dur="15s" repeatCount="indefinite"
        values="0;0;285;285;0;0;0"
        keyTimes="0;0.200;0.280;0.347;0.387;0.400;1"/>
    </rect></clipPath>
    <clipPath id="typeP3" clipPathUnits="userSpaceOnUse"><rect x="135" y="-16" width="0" height="22">
      <animate attributeName="width" dur="15s" repeatCount="indefinite"
        values="0;0;235;235;0;0;0"
        keyTimes="0;0.400;0.480;0.547;0.587;0.600;1"/>
    </rect></clipPath>
    <clipPath id="typeP4" clipPathUnits="userSpaceOnUse"><rect x="135" y="-16" width="0" height="22">
      <animate attributeName="width" dur="15s" repeatCount="indefinite"
        values="0;0;275;275;0;0;0"
        keyTimes="0;0.600;0.680;0.747;0.787;0.800;1"/>
    </rect></clipPath>
    <clipPath id="typeP5" clipPathUnits="userSpaceOnUse"><rect x="135" y="-16" width="0" height="22">
      <animate attributeName="width" dur="15s" repeatCount="indefinite"
        values="0;0;320;320;0;0"
        keyTimes="0;0.800;0.880;0.947;0.987;1"/>
    </rect></clipPath>
  </defs>

  <!-- background + CRT scanlines -->
  <rect class="bg" width="1400" height="380"/>
  <rect width="1400" height="380" fill="url(#scanlines)"/>

  <!-- mesh atmosphere (multiple radials = depth) -->
  <ellipse cx="700"  cy="180" rx="640" ry="200" fill="url(#halo)"/>
  <ellipse cx="700"  cy="180" rx="360" ry="90"  fill="url(#centerGlow)"/>
  <ellipse cx="180"  cy="200" rx="240" ry="180" fill="url(#cornerCyan)"/>
  <ellipse cx="1240" cy="200" rx="260" ry="200" fill="url(#cornerAmber)"/>
  <ellipse cx="700"  cy="340" rx="540" ry="80"  fill="url(#bottomGlow)"/>

  <!-- CRT vignette overlay focuses eye to centre. Render BEFORE the constellation so glow shines through. -->
  <rect width="1400" height="380" fill="url(#vignette)" opacity="0.7" style="mix-blend-mode:multiply"/>

  <!-- hairlines -->
  <line class="rule" x1="0" y1="1"   x2="1400" y2="1"/>
  <line class="rule" x1="0" y1="379" x2="1400" y2="379"/>

  <!-- CRT scan beam: one horizontal hairline + soft glow band drifting top to bottom every 10s,
       then jumping back. Renders behind the constellation. Iconic cyberpunk move at low opacity
       so it reads as ambient atmosphere, not the focal element. -->
  <g>
    <rect x="0" y="-2" width="1400" height="4" fill="#22D3EE" opacity="0.08"/>
    <line x1="0" y1="0" x2="1400" y2="0" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="0.6"/>
    <animateTransform attributeName="transform" type="translate"
      values="0 30; 0 372; 0 30"
      keyTimes="0; 0.92; 1"
      dur="10s" repeatCount="indefinite"/>
  </g>

  <!-- HUD corner brackets -->
  <g class="hud">
    <path d="M 18 12 L 18 32 M 18 12 L 38 12"/>
    <path d="M 1382 12 L 1382 32 M 1382 12 L 1362 12"/>
    <path d="M 18 368 L 18 348 M 18 368 L 38 368"/>
    <path d="M 1382 368 L 1382 348 M 1382 368 L 1362 368"/>
  </g>

  <!-- edges: left cluster -->
  <g class="edge">
    <path d="M 100 55  L 230 130"/>
    <path d="M 230 130 L 360 50"/>
    <path d="M 100 55  L 130 245"/>
    <path d="M 130 245 L 270 295"/>
    <path d="M 270 295 L 410 215"/>
    <path d="M 410 215 L 360 50"/>
    <path d="M 230 130 L 410 215"/>
  </g>
  <!-- edges: right cluster -->
  <g class="edge">
    <path d="M 1000 60  L 1100 130"/>
    <path d="M 1100 130 L 1280 55"/>
    <path d="M 1000 60  L 980 290"/>
    <path d="M 980 290  L 1150 235"/>
    <path d="M 1150 235 L 1310 305"/>
    <path d="M 1150 235 L 1280 55"/>
    <path d="M 1100 130 L 1150 235"/>
  </g>
  <!-- long static bridges across the title (no traveling dots = calmer) -->
  <g class="edge-strong">
    <path d="M 360 50  L 1000 60"/>
    <path d="M 410 215 L 980 290"/>
  </g>

  <!-- node glows (12) -->
  <g>
    <circle cx="100"  cy="55"  r="20" fill="url(#nodeGlow)"/>
    <circle cx="230"  cy="130" r="20" fill="url(#nodeGlow)"/>
    <circle cx="360"  cy="50"  r="20" fill="url(#nodeGlow)"/>
    <circle cx="130"  cy="245" r="20" fill="url(#nodeGlow)"/>
    <circle cx="270"  cy="295" r="20" fill="url(#nodeGlow)"/>
    <circle cx="410"  cy="215" r="20" fill="url(#nodeGlow)"/>
    <circle cx="1000" cy="60"  r="20" fill="url(#nodeGlow)"/>
    <circle cx="1100" cy="130" r="20" fill="url(#nodeGlow)"/>
    <circle cx="1280" cy="55"  r="20" fill="url(#nodeGlow)"/>
    <circle cx="980"  cy="290" r="20" fill="url(#nodeGlow)"/>
    <circle cx="1150" cy="235" r="20" fill="url(#nodeGlow)"/>
    <circle cx="1310" cy="305" r="20" fill="url(#nodeGlow)"/>
  </g>

  <!-- Edge energy: stroke-dashoffset on selected edges. Feels like packets flowing through a circuit,
       not particles drifting through space. pathLength=100 normalises the dash motion;
       dasharray "14 100" guarantees exactly one dash visible at a time per edge. Smooth loop. -->
  <g fill="none" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.95">
    <path d="M 100 55 L 230 130" pathLength="100" stroke-dasharray="14 100">
      <animate attributeName="stroke-dashoffset" from="0" to="-114" dur="3.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 270 295 L 410 215" pathLength="100" stroke-dasharray="14 100">
      <animate attributeName="stroke-dashoffset" from="0" to="-114" dur="3.6s" begin="0.9s" repeatCount="indefinite"/>
    </path>
    <path d="M 1100 130 L 1280 55" pathLength="100" stroke-dasharray="14 100">
      <animate attributeName="stroke-dashoffset" from="0" to="-114" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 980 290 L 1150 235" pathLength="100" stroke-dasharray="14 100">
      <animate attributeName="stroke-dashoffset" from="0" to="-114" dur="3.6s" begin="2.7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- nodes -->
  <g>
    <circle class="node n1"  cx="100"  cy="55"  r="4.5"/>
    <circle class="node n2"  cx="230"  cy="130" r="4.5"/>
    <circle class="node n3"  cx="360"  cy="50"  r="4.5"/>
    <circle class="node n4"  cx="130"  cy="245" r="4.5"/>
    <circle class="node n5"  cx="270"  cy="295" r="4.5"/>
    <circle class="node n6"  cx="410"  cy="215" r="4.5"/>
    <circle class="node n7"  cx="1000" cy="60"  r="4.5"/>
    <circle class="node n8"  cx="1100" cy="130" r="4.5"/>
    <circle class="node n9"  cx="1280" cy="55"  r="4.5"/>
    <circle class="node n10" cx="980"  cy="290" r="4.5"/>
    <circle class="node n11" cx="1150" cy="235" r="4.5"/>
    <circle class="node n12" cx="1310" cy="305" r="4.5"/>
  </g>

  <!-- eyebrow chip top-left (shorter text, wider rect with safe padding) -->
  <g transform="translate(40 28)">
    <rect x="0" y="0" width="132" height="22" rx="3" fill="none" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="0.9"/>
    <text class="eyebrow" x="66" y="15" text-anchor="middle">OS FOR AGENTS</text>
  </g>

  <!-- meta tag top-right (tightened) -->
  <text class="meta" x="1360" y="44" text-anchor="end">CLAUDE · CODEX · CURSOR · MCP</text>

  <!-- Title wordmark: chromatic-aberration ghosts + neon-glow filter.
       At rest: violet at x-1.5, cyan at x+1.5, white centered.
       Glitch burst: every 6s the ghosts snap out to x-5 / x+5 with 0.95 opacity for ~0.3s,
       then snap back. calcMode="discrete" makes the change sharp, not interpolated. -->
  <g filter="url(#neonGlow)">
    <text class="title" x="698.5" y="172" text-anchor="middle" fill="#B084FF" opacity="0.55">Contexter<animate attributeName="x" dur="6s" repeatCount="indefinite" calcMode="discrete" values="698.5;694;698.5" keyTimes="0;0.5;0.55"/><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="discrete" values="0.55;0.95;0.55" keyTimes="0;0.5;0.55"/></text>
    <text class="title" x="701.5" y="172" text-anchor="middle" fill="#22D3EE" opacity="0.45">Contexter<animate attributeName="x" dur="6s" repeatCount="indefinite" calcMode="discrete" values="701.5;706;701.5" keyTimes="0;0.5;0.55"/><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="discrete" values="0.45;0.9;0.45" keyTimes="0;0.5;0.55"/></text>
    <text class="title" x="700"   y="172" text-anchor="middle" fill="#FAFAFA">Contexter</text>
  </g>

  <!-- short cyan accent under the title -->
  <line x1="676" y1="192" x2="724" y2="192" stroke="#22D3EE" stroke-opacity="0.85" stroke-width="1.8"/>

  <!-- subtitle: the four categories. concrete, not generic. -->
  <text class="subtitle" x="700" y="222" text-anchor="middle">SKILLS · AGENTS · MEMORY · METHODOLOGY</text>

  <!-- typing terminal prompt (focal element, the only loud animation) -->
  <g transform="translate(460 285)">
    <text class="term" x="0" y="0" textLength="135" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#22D3EE">$</tspan><tspan fill="#94A3B8"> npx</tspan><tspan fill="#FAFAFA"> @ctxr/kit </tspan></text>

    <g clip-path="url(#typeP1)"><text class="term" x="135" y="0" textLength="270" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#94A3B8">install </tspan><tspan fill="#A78BFA">@ctxr/</tspan><tspan fill="#FAFAFA">skill-code-review</tspan></text></g>
    <g clip-path="url(#typeP2)"><text class="term" x="135" y="0" textLength="285" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#94A3B8">install </tspan><tspan fill="#A78BFA">@ctxr/</tspan><tspan fill="#FAFAFA">agent-staff-engineer</tspan></text></g>
    <g clip-path="url(#typeP3)"><text class="term" x="135" y="0" textLength="235" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#94A3B8">install </tspan><tspan fill="#A78BFA">@ctxr/</tspan><tspan fill="#FAFAFA">skill-llm-wiki</tspan></text></g>
    <g clip-path="url(#typeP4)"><text class="term" x="135" y="0" textLength="275" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#94A3B8">install </tspan><tspan fill="#A78BFA">@ctxr/</tspan><tspan fill="#FAFAFA">agent-plan-reviewer</tspan></text></g>
    <g clip-path="url(#typeP5)"><text class="term" x="135" y="0" textLength="320" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#94A3B8">install </tspan><tspan fill="#A78BFA">@ctxr/</tspan><tspan fill="#FAFAFA">agent-codebase-explorer</tspan></text></g>

    <rect x="135" y="-13" width="9" height="17" fill="#22D3EE">
      <animate attributeName="x"
        dur="15s" repeatCount="indefinite"
        values="135;405;405;135;135;135;420;420;135;135;135;370;370;135;135;135;410;410;135;135;135;455;455;135;135"
        keyTimes="0;0.080;0.147;0.187;0.199;0.200;0.280;0.347;0.387;0.399;0.400;0.480;0.547;0.587;0.599;0.600;0.680;0.747;0.787;0.799;0.800;0.880;0.947;0.987;1"/>
      <animate attributeName="opacity"
        dur="1s" repeatCount="indefinite"
        values="1;0" keyTimes="0;0.5" calcMode="discrete"/>
    </rect>
  </g>

  <!-- stats line: sells the breadth in one glance -->
  <text class="stats" x="700" y="338" text-anchor="middle">13 PACKAGES · 4 AGENTS · 3 SKILLS · 2 MEMORY BACKENDS · MIT</text>
</svg>
