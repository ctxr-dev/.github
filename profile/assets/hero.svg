<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 380" role="img" aria-label="Contexter: composable tools for AI coding agents" preserveAspectRatio="xMidYMid meet">
  <title>Contexter: composable tools for AI coding agents</title>
  <defs>
    <style><![CDATA[
      /* Palette extracted from the CP2077 "Used To Live Here" still:
         teal-black base, dominant teal-cyan glow, warm gold signage,
         muted magenta poster accents, cream-white foreground. */
      .bg { fill: #0B1F23; }
      .trace      { stroke: #1A6E64; stroke-opacity: 0.55; stroke-width: 1; fill: none; }
      .trace-faint{ stroke: #1A6E64; stroke-opacity: 0.30; stroke-width: 1; fill: none; stroke-dasharray: 3 4; }
      .hud { stroke: #E5C547; stroke-opacity: 0.65; stroke-width: 1.3; fill: none; }
      .rule { stroke: #3DBE9C; stroke-opacity: 0.18; stroke-width: 0.6; }
      .node-dim    { fill: #C19A4A; }
      .node-bright { fill: #E5C547; }
      .node-accent { fill: #A05080; }
      .node-inner  { fill: #0B1F23; }
      .eyebrow {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 10px; letter-spacing: 0.22em; fill: #0B1F23; font-weight: 700;
      }
      .meta {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 9.5px; letter-spacing: 0.20em; fill: #5A8F86;
      }
      .stats {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 11px; letter-spacing: 0.26em; fill: #7A8A82;
      }
      .title {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 80px; font-weight: 700; fill: #F0E8D5; letter-spacing: -0.05em;
      }
      .subtitle {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 13.5px; font-weight: 500; fill: #94A99A; letter-spacing: 0.32em;
      }
      .term {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 14px; letter-spacing: 0.02em;
      }
      .node {
        transform-box: fill-box; transform-origin: center;
        animation: nodePulse 7s ease-in-out infinite;
      }
      @keyframes nodePulse {
        0%, 100% { opacity: 0.55; }
        50%      { opacity: 1; }
      }
      .nA{animation-delay:0.0s}.nB{animation-delay:0.7s}.nC{animation-delay:1.4s}
      .nD{animation-delay:2.1s}.nE{animation-delay:2.8s}.nF{animation-delay:3.5s}
      .nG{animation-delay:4.2s}.nH{animation-delay:4.9s}.nI{animation-delay:5.6s}
      .nJ{animation-delay:6.3s}
      @media (prefers-reduced-motion: reduce) { .node { animation: none; } }
    ]]></style>

    <!-- CRT scanlines: thin teal hairlines at 4px (matches bar-interior glow). -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#3DBE9C" stroke-opacity="0.055" stroke-width="0.8"/>
    </pattern>

    <!-- Atmospheric halos -->
    <radialGradient id="haloTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3DBE9C" stop-opacity="0.28"/>
      <stop offset="55%"  stop-color="#1A6E64" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#3DBE9C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#E5C547" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#E5C547" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cornerGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#C19A4A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C19A4A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cornerMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#A05080" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#A05080" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottomGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3DBE9C" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3DBE9C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#E5C547" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#E5C547" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlowMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#A05080" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#A05080" stop-opacity="0"/>
    </radialGradient>

    <!-- CRT corner vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="70%"  stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <!-- Neon halo on the wordmark: warm gold (Afterlife-sign vibe), no chromatic split. -->
    <filter id="goldHalo" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feFlood flood-color="#E5C547" flood-opacity="0.55" result="goldFlood"/>
      <feComposite in="goldFlood" in2="blur" operator="in" result="goldBlur"/>
      <feMerge>
        <feMergeNode in="goldBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Typing clipPaths. rect.x must match the suffix text.x (135) so the visible window grows from the suffix start. -->
    <clipPath id="typeP1" clipPathUnits="userSpaceOnUse"><rect x="135" y="-16" width="0" height="22">
      <animate attributeName="width" dur="15s" repeatCount="indefinite"
        values="0;270;270;0;0;0"
        keyTimes="0;0.080;0.147;0.187;0.200;1"/>
    </rect></clipPath>
    <clipPath id="typeP2" clipPathUnits="userSpaceOnUse"><rect x="135" y="-16" width="0" height="22">
      <animate attributeName="width" dur="15s" repeatCount="indefinite"
        values="0;0;285;285;0;0;0"
        keyTimes="0;0.200;0.280;0.347;0.387;0.400;1"/>
    </rect></clipPath>
    <clipPath id="typeP3" clipPathUnits="userSpaceOnUse"><rect x="135" y="-16" width="0" height="22">
      <animate attributeName="width" dur="15s" repeatCount="indefinite"
        values="0;0;235;235;0;0;0"
        keyTimes="0;0.400;0.480;0.547;0.587;0.600;1"/>
    </rect></clipPath>
    <clipPath id="typeP4" clipPathUnits="userSpaceOnUse"><rect x="135" y="-16" width="0" height="22">
      <animate attributeName="width" dur="15s" repeatCount="indefinite"
        values="0;0;275;275;0;0;0"
        keyTimes="0;0.600;0.680;0.747;0.787;0.800;1"/>
    </rect></clipPath>
    <clipPath id="typeP5" clipPathUnits="userSpaceOnUse"><rect x="135" y="-16" width="0" height="22">
      <animate attributeName="width" dur="15s" repeatCount="indefinite"
        values="0;0;320;320;0;0"
        keyTimes="0;0.800;0.880;0.947;0.987;1"/>
    </rect></clipPath>
  </defs>

  <!-- background + CRT scanlines -->
  <rect class="bg" width="1400" height="380"/>
  <rect width="1400" height="380" fill="url(#scanlines)"/>

  <!-- mesh atmosphere (teal-dominant with warm + magenta corners, per the reference image) -->
  <ellipse cx="700"  cy="180" rx="680" ry="220" fill="url(#haloTeal)"/>
  <ellipse cx="700"  cy="180" rx="380" ry="100" fill="url(#haloGold)"/>
  <ellipse cx="180"  cy="200" rx="240" ry="180" fill="url(#cornerGold)"/>
  <ellipse cx="1240" cy="200" rx="260" ry="200" fill="url(#cornerMagenta)"/>
  <ellipse cx="700"  cy="350" rx="540" ry="80"  fill="url(#bottomGlow)"/>

  <!-- vignette -->
  <rect width="1400" height="380" fill="url(#vignette)" opacity="0.7" style="mix-blend-mode:multiply"/>

  <!-- hairlines -->
  <line class="rule" x1="0" y1="1"   x2="1400" y2="1"/>
  <line class="rule" x1="0" y1="379" x2="1400" y2="379"/>

  <!-- CRT scan beam (slow drift top to bottom) -->
  <g>
    <rect x="0" y="-2" width="1400" height="4" fill="#3DBE9C" opacity="0.08"/>
    <line x1="0" y1="0" x2="1400" y2="0" stroke="#3DBE9C" stroke-opacity="0.45" stroke-width="0.6"/>
    <animateTransform attributeName="transform" type="translate"
      values="0 30; 0 372; 0 30"
      keyTimes="0; 0.92; 1"
      dur="11s" repeatCount="indefinite"/>
  </g>

  <!-- HUD corner brackets (warm gold) -->
  <g class="hud">
    <path d="M 18 12 L 18 32 M 18 12 L 38 12"/>
    <path d="M 1382 12 L 1382 32 M 1382 12 L 1362 12"/>
    <path d="M 18 368 L 18 348 M 18 368 L 38 368"/>
    <path d="M 1382 368 L 1382 348 M 1382 368 L 1362 368"/>
  </g>

  <!-- Circuit-board traces. ORTHOGONAL only (right-angle paths). Two clusters + one bridge over the title. -->
  <g class="trace">
    <!-- left cluster outlines -->
    <path d="M 90 65  L 240 65"/>     <!-- L1 → L2 -->
    <path d="M 240 65 L 240 165"/>    <!-- L2 → L3 -->
    <path d="M 240 165 L 400 165"/>   <!-- L3 → L4 -->
    <path d="M 90 65  L 90 290"/>     <!-- L1 → L5 vertical -->
    <path d="M 90 290 L 400 290"/>    <!-- L5 → L6 horizontal -->
    <path d="M 400 290 L 400 165"/>   <!-- L6 → L4 vertical -->
    <!-- right cluster outlines (mirrored) -->
    <path d="M 1310 65  L 1160 65"/>  <!-- R1 → R2 -->
    <path d="M 1160 65  L 1160 165"/> <!-- R2 → R3 -->
    <path d="M 1160 165 L 1000 165"/> <!-- R3 → R4 -->
    <path d="M 1310 65  L 1310 290"/> <!-- R1 → R5 -->
    <path d="M 1310 290 L 1000 290"/> <!-- R5 → R6 -->
    <path d="M 1000 290 L 1000 165"/> <!-- R6 → R4 -->
  </g>
  <!-- bridge over title (dashed). Routes up to y=35 (just under top HUD) then across, then down. -->
  <g class="trace-faint">
    <path d="M 400 165 L 400 35 L 1000 35 L 1000 165"/>
  </g>

  <!-- Node glows (rendered first so they shine underneath the squares) -->
  <g>
    <circle cx="90"   cy="65"  r="18" fill="url(#nodeGlow)"/>
    <circle cx="240"  cy="65"  r="18" fill="url(#nodeGlow)"/>
    <circle cx="240"  cy="165" r="20" fill="url(#nodeGlowMagenta)"/>
    <circle cx="400"  cy="165" r="26" fill="url(#nodeGlow)"/>
    <circle cx="90"   cy="290" r="18" fill="url(#nodeGlow)"/>
    <circle cx="400"  cy="290" r="18" fill="url(#nodeGlow)"/>
    <circle cx="1310" cy="65"  r="18" fill="url(#nodeGlow)"/>
    <circle cx="1160" cy="65"  r="18" fill="url(#nodeGlow)"/>
    <circle cx="1160" cy="165" r="20" fill="url(#nodeGlowMagenta)"/>
    <circle cx="1000" cy="165" r="26" fill="url(#nodeGlow)"/>
    <circle cx="1310" cy="290" r="18" fill="url(#nodeGlow)"/>
    <circle cx="1000" cy="290" r="18" fill="url(#nodeGlow)"/>
  </g>

  <!-- Energy packets along selected traces. stroke-dashoffset on pathLength=100 paths.
       Reads as data packets flowing through a circuit. Yellow on cyan, very CP2077. -->
  <g fill="none" stroke="#E5C547" stroke-width="2" stroke-linecap="square" stroke-opacity="0.95">
    <!-- Left chain L1 → L2 → L3 → L4 -->
    <path d="M 90 65 L 240 65 L 240 165 L 400 165" pathLength="100" stroke-dasharray="14 100">
      <animate attributeName="stroke-dashoffset" from="0" to="-114" dur="4s" repeatCount="indefinite"/>
    </path>
    <!-- Right chain R1 → R2 → R3 → R4 -->
    <path d="M 1310 65 L 1160 65 L 1160 165 L 1000 165" pathLength="100" stroke-dasharray="14 100">
      <animate attributeName="stroke-dashoffset" from="0" to="-114" dur="4s" begin="1s" repeatCount="indefinite"/>
    </path>
    <!-- Left bottom run L5 → L6 → L4 -->
    <path d="M 90 290 L 400 290 L 400 165" pathLength="100" stroke-dasharray="14 100">
      <animate attributeName="stroke-dashoffset" from="0" to="-114" dur="4s" begin="2s" repeatCount="indefinite"/>
    </path>
    <!-- Right bottom run R5 → R6 → R4 -->
    <path d="M 1310 290 L 1000 290 L 1000 165" pathLength="100" stroke-dasharray="14 100">
      <animate attributeName="stroke-dashoffset" from="0" to="-114" dur="4s" begin="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Bridge packet: slower, traverses the long over-title route. -->
  <g fill="none" stroke="#3DBE9C" stroke-width="1.6" stroke-linecap="square" stroke-opacity="0.9">
    <path d="M 400 165 L 400 35 L 1000 35 L 1000 165" pathLength="100" stroke-dasharray="10 100">
      <animate attributeName="stroke-dashoffset" from="0" to="-110" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- NODES: small filled squares (circuit-board feel). Key nodes are bigger; one accent per cluster is magenta. -->
  <g>
    <!-- left cluster -->
    <rect class="node node-dim    nA" x="86"  y="61"  width="8"  height="8"/>            <!-- L1 -->
    <rect class="node node-dim    nB" x="236" y="61"  width="8"  height="8"/>            <!-- L2 -->
    <rect class="node node-accent nC" x="234" y="159" width="12" height="12" rx="1"/>    <!-- L3 (magenta accent) -->
    <!-- L4 KEY node: 14x14 with inner dark dot, like a status light. -->
    <g class="node nD">
      <rect class="node-bright" x="392" y="157" width="16" height="16" rx="1"/>
      <rect class="node-inner"  x="397" y="162" width="6"  height="6"/>
    </g>
    <rect class="node node-dim    nE" x="86"  y="286" width="8"  height="8"/>            <!-- L5 -->
    <rect class="node node-dim    nF" x="396" y="286" width="8"  height="8"/>            <!-- L6 -->
    <!-- right cluster (mirrored) -->
    <rect class="node node-dim    nG" x="1306" y="61"  width="8"  height="8"/>           <!-- R1 -->
    <rect class="node node-dim    nH" x="1156" y="61"  width="8"  height="8"/>           <!-- R2 -->
    <rect class="node node-accent nI" x="1154" y="159" width="12" height="12" rx="1"/>   <!-- R3 (magenta) -->
    <g class="node nJ">
      <rect class="node-bright" x="992" y="157" width="16" height="16" rx="1"/>
      <rect class="node-inner"  x="997" y="162" width="6"  height="6"/>
    </g>
    <rect class="node node-dim"   x="1306" y="286" width="8"  height="8"/>               <!-- R5 (no pulse delay class needed; rendered last) -->
    <rect class="node node-dim"   x="996"  y="286" width="8"  height="8"/>               <!-- R6 -->
  </g>

  <!-- Eyebrow chip top-left: BLACK-on-GOLD CP2077 sign style.
       Solid gold fill, dark teal-black text, tiny corner notch on top-right. -->
  <g transform="translate(40 28)">
    <path d="M 0 0 H 150 L 158 8 V 22 H 0 Z" fill="#E5C547"/>
    <text class="eyebrow" x="75" y="15.5" text-anchor="middle">OS FOR AGENTS</text>
  </g>

  <!-- Meta tag top-right -->
  <text class="meta" x="1360" y="44" text-anchor="end">CLAUDE · CODEX · CURSOR · MCP</text>

  <!-- Title wordmark: cream-white with a warm gold halo (Afterlife-sign vibe).
       No chromatic-aberration ghosts, no glitch burst. Clean cinematic. -->
  <g filter="url(#goldHalo)">
    <text class="title" x="700" y="172" text-anchor="middle">Contexter</text>
  </g>

  <!-- short gold accent under the title -->
  <line x1="676" y1="192" x2="724" y2="192" stroke="#E5C547" stroke-opacity="0.85" stroke-width="2"/>

  <!-- subtitle -->
  <text class="subtitle" x="700" y="222" text-anchor="middle">SKILLS · AGENTS · MEMORY · METHODOLOGY</text>

  <!-- typing terminal -->
  <g transform="translate(460 285)">
    <text class="term" x="0" y="0" textLength="135" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#3DBE9C">$</tspan><tspan fill="#7A8A82"> npx</tspan><tspan fill="#F0E8D5"> @ctxr/kit </tspan></text>

    <g clip-path="url(#typeP1)"><text class="term" x="135" y="0" textLength="270" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#7A8A82">install </tspan><tspan fill="#E5C547">@ctxr/</tspan><tspan fill="#F0E8D5">skill-code-review</tspan></text></g>
    <g clip-path="url(#typeP2)"><text class="term" x="135" y="0" textLength="285" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#7A8A82">install </tspan><tspan fill="#E5C547">@ctxr/</tspan><tspan fill="#F0E8D5">agent-staff-engineer</tspan></text></g>
    <g clip-path="url(#typeP3)"><text class="term" x="135" y="0" textLength="235" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#7A8A82">install </tspan><tspan fill="#E5C547">@ctxr/</tspan><tspan fill="#F0E8D5">skill-llm-wiki</tspan></text></g>
    <g clip-path="url(#typeP4)"><text class="term" x="135" y="0" textLength="275" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#7A8A82">install </tspan><tspan fill="#E5C547">@ctxr/</tspan><tspan fill="#F0E8D5">agent-plan-reviewer</tspan></text></g>
    <g clip-path="url(#typeP5)"><text class="term" x="135" y="0" textLength="320" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#7A8A82">install </tspan><tspan fill="#E5C547">@ctxr/</tspan><tspan fill="#F0E8D5">agent-codebase-explorer</tspan></text></g>

    <rect x="135" y="-13" width="9" height="17" fill="#3DBE9C">
      <animate attributeName="x"
        dur="15s" repeatCount="indefinite"
        values="135;405;405;135;135;135;420;420;135;135;135;370;370;135;135;135;410;410;135;135;135;455;455;135;135"
        keyTimes="0;0.080;0.147;0.187;0.199;0.200;0.280;0.347;0.387;0.399;0.400;0.480;0.547;0.587;0.599;0.600;0.680;0.747;0.787;0.799;0.800;0.880;0.947;0.987;1"/>
      <animate attributeName="opacity"
        dur="1s" repeatCount="indefinite"
        values="1;0" keyTimes="0;0.5" calcMode="discrete"/>
    </rect>
  </g>

  <!-- stats line -->
  <text class="stats" x="700" y="338" text-anchor="middle">13 PACKAGES · 4 AGENTS · 3 SKILLS · 2 MEMORY BACKENDS · MIT</text>
</svg>
