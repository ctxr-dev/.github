<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 380" role="img" aria-label="Contexter: composable tools for AI coding agents" preserveAspectRatio="xMidYMid meet">
  <title>Contexter: composable tools for AI coding agents</title>
  <defs>
    <style><![CDATA[
      .bg { fill: #0A0B14; }
      .grid path { stroke: #1d2237; stroke-width: 0.5; }
      .edge { stroke: #A78BFA; stroke-opacity: 0.20; stroke-width: 1; fill: none; }
      .edge-strong { stroke: #A78BFA; stroke-opacity: 0.42; stroke-width: 1.1; fill: none; stroke-dasharray: 3 4; }
      .hud { stroke: #22D3EE; stroke-opacity: 0.55; stroke-width: 1.2; fill: none; }
      .rule { stroke: #22D3EE; stroke-opacity: 0.16; stroke-width: 0.6; }
      .node { fill: #0A0B14; stroke: #A78BFA; stroke-width: 1.6; }
      .msg { fill: #22D3EE; }
      .msg-amber { fill: #FBBF24; }
      .spark { fill: #FBBF24; }
      .eyebrow {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 9.5px; letter-spacing: 0.24em; fill: #22D3EE;
      }
      .meta {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 9.5px; letter-spacing: 0.20em; fill: #475569;
      }
      .stats {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 11px; letter-spacing: 0.26em; fill: #64748B;
      }
      .title {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 80px; font-weight: 700; fill: #FAFAFA; letter-spacing: -0.05em;
      }
      .subtitle {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 13.5px; font-weight: 500; fill: #94A3B8; letter-spacing: 0.32em;
      }
      .term {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 14px; letter-spacing: 0.02em;
      }
      .node { transform-box: fill-box; transform-origin: center; animation: nodePulse 3.4s ease-in-out infinite; }
      @keyframes nodePulse {
        0%, 100% { stroke-opacity: 0.42; }
        50% { stroke-opacity: 1; }
      }
      .n1{animation-delay:0.0s}.n2{animation-delay:0.28s}.n3{animation-delay:0.56s}
      .n4{animation-delay:0.84s}.n5{animation-delay:1.12s}.n6{animation-delay:1.40s}
      .n7{animation-delay:1.68s}.n8{animation-delay:1.96s}.n9{animation-delay:2.24s}
      .n10{animation-delay:2.52s}.n11{animation-delay:2.80s}.n12{animation-delay:3.08s}
      @media (prefers-reduced-motion: reduce) { .node { animation: none; } }
    ]]></style>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <g class="grid"><path d="M 36 0 L 0 0 0 36" fill="none"/></g>
    </pattern>

    <!-- layered atmosphere: center violet halo + cyan upper-left whisper + amber bottom warm + cyan center spot -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#7C3AED" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cornerCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cornerAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottomGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>

    <!-- 15-second typing loop. Each phrase reveals via a clipPath whose rect.width animates.
         Phrase widths: P1 270, P2 285, P3 235, P4 275, P5 320 (px in this textLength). -->
    <clipPath id="typeP1"><rect x="0" y="-16" width="0" height="22">
      <animate attributeName="width" dur="15s" repeatCount="indefinite"
        values="0;270;270;0;0;0"
        keyTimes="0;0.080;0.147;0.187;0.200;1"/>
    </rect></clipPath>
    <clipPath id="typeP2"><rect x="0" y="-16" width="0" height="22">
      <animate attributeName="width" dur="15s" repeatCount="indefinite"
        values="0;0;285;285;0;0;0"
        keyTimes="0;0.200;0.280;0.347;0.387;0.400;1"/>
    </rect></clipPath>
    <clipPath id="typeP3"><rect x="0" y="-16" width="0" height="22">
      <animate attributeName="width" dur="15s" repeatCount="indefinite"
        values="0;0;235;235;0;0;0"
        keyTimes="0;0.400;0.480;0.547;0.587;0.600;1"/>
    </rect></clipPath>
    <clipPath id="typeP4"><rect x="0" y="-16" width="0" height="22">
      <animate attributeName="width" dur="15s" repeatCount="indefinite"
        values="0;0;275;275;0;0;0"
        keyTimes="0;0.600;0.680;0.747;0.787;0.800;1"/>
    </rect></clipPath>
    <clipPath id="typeP5"><rect x="0" y="-16" width="0" height="22">
      <animate attributeName="width" dur="15s" repeatCount="indefinite"
        values="0;0;320;320;0;0"
        keyTimes="0;0.800;0.880;0.947;0.987;1"/>
    </rect></clipPath>
  </defs>

  <!-- background -->
  <rect class="bg" width="1400" height="380"/>
  <rect width="1400" height="380" fill="url(#grid)" opacity="0.55"/>

  <!-- mesh atmosphere (multiple radials = depth) -->
  <ellipse cx="700"  cy="180" rx="640" ry="200" fill="url(#halo)"/>
  <ellipse cx="700"  cy="180" rx="360" ry="90"  fill="url(#centerGlow)"/>
  <ellipse cx="180"  cy="200" rx="240" ry="180" fill="url(#cornerCyan)"/>
  <ellipse cx="1240" cy="200" rx="260" ry="200" fill="url(#cornerAmber)"/>
  <ellipse cx="700"  cy="340" rx="540" ry="80"  fill="url(#bottomGlow)"/>

  <!-- hairlines -->
  <line class="rule" x1="0" y1="1"   x2="1400" y2="1"/>
  <line class="rule" x1="0" y1="379" x2="1400" y2="379"/>

  <!-- HUD corner brackets -->
  <g class="hud">
    <path d="M 18 12 L 18 32 M 18 12 L 38 12"/>
    <path d="M 1382 12 L 1382 32 M 1382 12 L 1362 12"/>
    <path d="M 18 368 L 18 348 M 18 368 L 38 368"/>
    <path d="M 1382 368 L 1382 348 M 1382 368 L 1362 368"/>
  </g>

  <!-- edges: left cluster -->
  <g class="edge">
    <path d="M 100 55  L 230 130"/>
    <path d="M 230 130 L 360 50"/>
    <path d="M 100 55  L 130 245"/>
    <path d="M 130 245 L 270 295"/>
    <path d="M 270 295 L 410 215"/>
    <path d="M 410 215 L 360 50"/>
    <path d="M 230 130 L 410 215"/>
  </g>
  <!-- edges: right cluster -->
  <g class="edge">
    <path d="M 1000 60  L 1100 130"/>
    <path d="M 1100 130 L 1280 55"/>
    <path d="M 1000 60  L 980 290"/>
    <path d="M 980 290  L 1150 235"/>
    <path d="M 1150 235 L 1310 305"/>
    <path d="M 1150 235 L 1280 55"/>
    <path d="M 1100 130 L 1150 235"/>
  </g>
  <!-- long bridges across the title -->
  <g class="edge-strong">
    <path d="M 360 50  L 1000 60"/>
    <path d="M 410 215 L 980 290"/>
  </g>

  <!-- node glows -->
  <g>
    <circle cx="100"  cy="55"  r="20" fill="url(#nodeGlow)"/>
    <circle cx="230"  cy="130" r="20" fill="url(#nodeGlow)"/>
    <circle cx="360"  cy="50"  r="20" fill="url(#nodeGlow)"/>
    <circle cx="130"  cy="245" r="20" fill="url(#nodeGlow)"/>
    <circle cx="270"  cy="295" r="20" fill="url(#nodeGlow)"/>
    <circle cx="410"  cy="215" r="20" fill="url(#nodeGlow)"/>
    <circle cx="1000" cy="60"  r="20" fill="url(#nodeGlow)"/>
    <circle cx="1100" cy="130" r="20" fill="url(#nodeGlow)"/>
    <circle cx="1280" cy="55"  r="20" fill="url(#nodeGlow)"/>
    <circle cx="980"  cy="290" r="20" fill="url(#nodeGlow)"/>
    <circle cx="1150" cy="235" r="20" fill="url(#nodeGlow)"/>
    <circle cx="1310" cy="305" r="20" fill="url(#nodeGlow)"/>
  </g>

  <!-- traveling cyan messages along short edges -->
  <g class="msg">
    <circle r="2.4"><animateMotion dur="2.2s" repeatCount="indefinite" path="M 100 55 L 230 130"/></circle>
    <circle r="2.4"><animateMotion dur="2.6s" begin="0.4s" repeatCount="indefinite" path="M 230 130 L 360 50"/></circle>
    <circle r="2.4"><animateMotion dur="2.0s" begin="0.9s" repeatCount="indefinite" path="M 130 245 L 270 295"/></circle>
    <circle r="2.4"><animateMotion dur="2.4s" begin="1.4s" repeatCount="indefinite" path="M 270 295 L 410 215"/></circle>
    <circle r="2.4"><animateMotion dur="2.6s" begin="1.8s" repeatCount="indefinite" path="M 230 130 L 410 215"/></circle>
    <circle r="2.4"><animateMotion dur="2.2s" repeatCount="indefinite" path="M 1000 60 L 1100 130"/></circle>
    <circle r="2.4"><animateMotion dur="2.6s" begin="0.5s" repeatCount="indefinite" path="M 1100 130 L 1280 55"/></circle>
    <circle r="2.4"><animateMotion dur="2.0s" begin="1.0s" repeatCount="indefinite" path="M 980 290 L 1150 235"/></circle>
    <circle r="2.4"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M 1150 235 L 1310 305"/></circle>
    <circle r="2.4"><animateMotion dur="2.2s" begin="0.9s" repeatCount="indefinite" path="M 1100 130 L 1150 235"/></circle>
  </g>

  <!-- long amber bridges crossing the title area -->
  <g class="msg-amber">
    <circle r="3"><animateMotion dur="4.8s" repeatCount="indefinite" path="M 360 50 L 1000 60"/></circle>
    <circle r="3"><animateMotion dur="4.8s" begin="2.4s" repeatCount="indefinite" path="M 980 290 L 410 215"/></circle>
  </g>

  <!-- nodes -->
  <g>
    <circle class="node n1"  cx="100"  cy="55"  r="4.5"/>
    <circle class="node n2"  cx="230"  cy="130" r="4.5"/>
    <circle class="node n3"  cx="360"  cy="50"  r="4.5"/>
    <circle class="node n4"  cx="130"  cy="245" r="4.5"/>
    <circle class="node n5"  cx="270"  cy="295" r="4.5"/>
    <circle class="node n6"  cx="410"  cy="215" r="4.5"/>
    <circle class="node n7"  cx="1000" cy="60"  r="4.5"/>
    <circle class="node n8"  cx="1100" cy="130" r="4.5"/>
    <circle class="node n9"  cx="1280" cy="55"  r="4.5"/>
    <circle class="node n10" cx="980"  cy="290" r="4.5"/>
    <circle class="node n11" cx="1150" cy="235" r="4.5"/>
    <circle class="node n12" cx="1310" cy="305" r="4.5"/>
  </g>

  <!-- amber sparkles around the title -->
  <g class="spark">
    <g transform="translate(478 130)"><path d="M 0 -7 L 1.6 -1.6 L 7 0 L 1.6 1.6 L 0 7 L -1.6 1.6 L -7 0 L -1.6 -1.6 Z" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/>
    </path></g>
    <g transform="translate(922 130)"><path d="M 0 -7 L 1.6 -1.6 L 7 0 L 1.6 1.6 L 0 7 L -1.6 1.6 L -7 0 L -1.6 -1.6 Z" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="0.7s" repeatCount="indefinite"/>
    </path></g>
    <g transform="translate(580 108)"><path d="M 0 -5 L 1.2 -1.2 L 5 0 L 1.2 1.2 L 0 5 L -1.2 1.2 L -5 0 L -1.2 -1.2 Z" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
    </path></g>
    <g transform="translate(820 108)"><path d="M 0 -5 L 1.2 -1.2 L 5 0 L 1.2 1.2 L 0 5 L -1.2 1.2 L -5 0 L -1.2 -1.2 Z" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="1.9s" repeatCount="indefinite"/>
    </path></g>
    <g transform="translate(556 248)"><path d="M 0 -5 L 1.2 -1.2 L 5 0 L 1.2 1.2 L 0 5 L -1.2 1.2 L -5 0 L -1.2 -1.2 Z" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0.3s" repeatCount="indefinite"/>
    </path></g>
    <g transform="translate(844 248)"><path d="M 0 -5 L 1.2 -1.2 L 5 0 L 1.2 1.2 L 0 5 L -1.2 1.2 L -5 0 L -1.2 -1.2 Z" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="1.6s" repeatCount="indefinite"/>
    </path></g>
  </g>

  <!-- eyebrow chip top-left -->
  <g transform="translate(48 30)">
    <rect x="0" y="0" width="186" height="22" rx="3" fill="none" stroke="#22D3EE" stroke-opacity="0.42" stroke-width="0.9"/>
    <text class="eyebrow" x="93" y="15" text-anchor="middle">CONTEXTER · OS FOR AGENTS</text>
  </g>

  <!-- meta tag top-right -->
  <text class="meta" x="1352" y="44" text-anchor="end">CLAUDE · CODEX · CURSOR · ANY MCP CLIENT</text>

  <!-- title wordmark -->
  <text class="title" x="700" y="172" text-anchor="middle">Contexter</text>

  <!-- short cyan accent under the title -->
  <line x1="676" y1="192" x2="724" y2="192" stroke="#22D3EE" stroke-opacity="0.85" stroke-width="1.8"/>

  <!-- subtitle: the four categories. concrete, not generic. -->
  <text class="subtitle" x="700" y="222" text-anchor="middle">SKILLS · AGENTS · MEMORY · METHODOLOGY</text>

  <!-- typing terminal prompt -->
  <g transform="translate(460 285)">
    <!-- prefix (always visible). textLength forces a deterministic 135px width so cursor + clipPath positions are stable. -->
    <text class="term" x="0" y="0" textLength="135" lengthAdjust="spacingAndGlyphs">
      <tspan fill="#22D3EE">$</tspan><tspan fill="#94A3B8"> npx</tspan><tspan fill="#FAFAFA"> @ctxr/kit </tspan>
    </text>

    <!-- 5 phrases, each clipped by an animated rect that grows then shrinks during its 3-second slot in the 15s loop. -->
    <g clip-path="url(#typeP1)">
      <text class="term" x="135" y="0" textLength="270" lengthAdjust="spacingAndGlyphs">
        <tspan fill="#94A3B8">install </tspan><tspan fill="#A78BFA">@ctxr/</tspan><tspan fill="#FAFAFA">skill-code-review</tspan>
      </text>
    </g>
    <g clip-path="url(#typeP2)">
      <text class="term" x="135" y="0" textLength="285" lengthAdjust="spacingAndGlyphs">
        <tspan fill="#94A3B8">install </tspan><tspan fill="#A78BFA">@ctxr/</tspan><tspan fill="#FAFAFA">agent-staff-engineer</tspan>
      </text>
    </g>
    <g clip-path="url(#typeP3)">
      <text class="term" x="135" y="0" textLength="235" lengthAdjust="spacingAndGlyphs">
        <tspan fill="#94A3B8">install </tspan><tspan fill="#A78BFA">@ctxr/</tspan><tspan fill="#FAFAFA">skill-llm-wiki</tspan>
      </text>
    </g>
    <g clip-path="url(#typeP4)">
      <text class="term" x="135" y="0" textLength="275" lengthAdjust="spacingAndGlyphs">
        <tspan fill="#94A3B8">install </tspan><tspan fill="#A78BFA">@ctxr/</tspan><tspan fill="#FAFAFA">agent-plan-reviewer</tspan>
      </text>
    </g>
    <g clip-path="url(#typeP5)">
      <text class="term" x="135" y="0" textLength="320" lengthAdjust="spacingAndGlyphs">
        <tspan fill="#94A3B8">install </tspan><tspan fill="#A78BFA">@ctxr/</tspan><tspan fill="#FAFAFA">agent-codebase-explorer</tspan>
      </text>
    </g>

    <!-- cursor: x follows the end of the currently-typed phrase across the 15s loop; opacity blinks every second. -->
    <rect x="135" y="-13" width="9" height="17" fill="#22D3EE">
      <animate attributeName="x"
        dur="15s" repeatCount="indefinite"
        values="135;405;405;135;135;135;420;420;135;135;135;370;370;135;135;135;410;410;135;135;135;455;455;135;135"
        keyTimes="0;0.080;0.147;0.187;0.199;0.200;0.280;0.347;0.387;0.399;0.400;0.480;0.547;0.587;0.599;0.600;0.680;0.747;0.787;0.799;0.800;0.880;0.947;0.987;1"/>
      <animate attributeName="opacity"
        dur="1s" repeatCount="indefinite"
        values="1;0" keyTimes="0;0.5" calcMode="discrete"/>
    </rect>
  </g>

  <!-- stats line: sells the breadth in one glance -->
  <text class="stats" x="700" y="338" text-anchor="middle">13 PACKAGES · 4 AGENTS · 3 SKILLS · 2 MEMORY BACKENDS · MIT</text>
</svg>
