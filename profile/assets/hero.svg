<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="ctxr-dev: composable tools for AI coding agents" preserveAspectRatio="xMidYMid meet">
  <title>ctxr-dev: composable tools for AI coding agents</title>
  <defs>
    <style><![CDATA[
      .bg { fill: #0A0B14; }
      .grid path { stroke: #1d2237; stroke-width: 0.5; }
      .edge { stroke: #A78BFA; stroke-opacity: 0.22; stroke-width: 1; fill: none; }
      .edge-strong { stroke: #A78BFA; stroke-opacity: 0.42; stroke-width: 1.1; fill: none; stroke-dasharray: 3 4; }
      .hud { stroke: #22D3EE; stroke-opacity: 0.55; stroke-width: 1.2; fill: none; }
      .rule { stroke: #22D3EE; stroke-opacity: 0.18; stroke-width: 0.6; }
      .node { fill: #0A0B14; stroke: #A78BFA; stroke-width: 1.6; }
      .msg { fill: #22D3EE; }
      .msg-amber { fill: #FBBF24; }
      .spark { fill: #FBBF24; }
      .eyebrow {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 9px; letter-spacing: 0.22em; fill: #22D3EE;
      }
      .meta {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 9px; letter-spacing: 0.18em; fill: #475569;
      }
      .title {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 72px; font-weight: 700; fill: #FAFAFA; letter-spacing: -0.045em;
      }
      .subtitle {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 13px; font-weight: 500; fill: #94A3B8; letter-spacing: 0.22em;
      }
      .term {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 13px; letter-spacing: 0.03em;
      }
      .node { transform-box: fill-box; transform-origin: center; animation: nodePulse 3.2s ease-in-out infinite; }
      @keyframes nodePulse {
        0%, 100% { stroke-opacity: 0.45; }
        50% { stroke-opacity: 1; }
      }
      .n1 { animation-delay: 0.0s; } .n2 { animation-delay: 0.25s; }
      .n3 { animation-delay: 0.5s; } .n4 { animation-delay: 0.75s; }
      .n5 { animation-delay: 1.0s; } .n6 { animation-delay: 1.25s; }
      .n7 { animation-delay: 1.5s; } .n8 { animation-delay: 1.75s; }
      .n9 { animation-delay: 2.0s; } .n10 { animation-delay: 2.25s; }
      .n11 { animation-delay: 2.5s; } .n12 { animation-delay: 2.75s; }
      .cursor { animation: blink 1.1s steps(2, start) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .node, .cursor { animation: none; }
      }
    ]]></style>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <g class="grid"><path d="M 32 0 L 0 0 0 32" fill="none"/></g>
    </pattern>

    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#A78BFA" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect class="bg" width="1200" height="320"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.55"/>

  <!-- atmosphere -->
  <ellipse cx="600" cy="160" rx="540" ry="180" fill="url(#halo)"/>
  <ellipse cx="600" cy="160" rx="300" ry="80" fill="url(#centerGlow)"/>

  <!-- top + bottom hairline rules -->
  <line class="rule" x1="0" y1="1" x2="1200" y2="1"/>
  <line class="rule" x1="0" y1="319" x2="1200" y2="319"/>

  <!-- HUD corner brackets -->
  <g class="hud">
    <path d="M 18 10 L 18 28 M 18 10 L 36 10"/>
    <path d="M 1182 10 L 1182 28 M 1182 10 L 1164 10"/>
    <path d="M 18 310 L 18 292 M 18 310 L 36 310"/>
    <path d="M 1182 310 L 1182 292 M 1182 310 L 1164 310"/>
  </g>

  <!-- edges: left cluster -->
  <g class="edge">
    <path d="M 100 50 L 220 115"/>
    <path d="M 220 115 L 340 45"/>
    <path d="M 100 50 L 120 230"/>
    <path d="M 120 230 L 260 275"/>
    <path d="M 260 275 L 380 200"/>
    <path d="M 380 200 L 340 45"/>
    <path d="M 220 115 L 380 200"/>
    <path d="M 100 50 L 220 115"/>
  </g>
  <!-- edges: right cluster -->
  <g class="edge">
    <path d="M 830 60 L 920 125"/>
    <path d="M 920 125 L 1090 50"/>
    <path d="M 830 60 L 820 265"/>
    <path d="M 820 265 L 970 220"/>
    <path d="M 970 220 L 1110 275"/>
    <path d="M 970 220 L 1090 50"/>
    <path d="M 920 125 L 970 220"/>
  </g>
  <!-- edges: long bridges across the title (dashed, stronger) -->
  <g class="edge-strong">
    <path d="M 340 45 L 830 60"/>
    <path d="M 380 200 L 820 265"/>
  </g>

  <!-- node glows -->
  <g>
    <circle cx="100"  cy="50"  r="18" fill="url(#nodeGlow)"/>
    <circle cx="220"  cy="115" r="18" fill="url(#nodeGlow)"/>
    <circle cx="340"  cy="45"  r="18" fill="url(#nodeGlow)"/>
    <circle cx="120"  cy="230" r="18" fill="url(#nodeGlow)"/>
    <circle cx="260"  cy="275" r="18" fill="url(#nodeGlow)"/>
    <circle cx="380"  cy="200" r="18" fill="url(#nodeGlow)"/>
    <circle cx="830"  cy="60"  r="18" fill="url(#nodeGlow)"/>
    <circle cx="920"  cy="125" r="18" fill="url(#nodeGlow)"/>
    <circle cx="1090" cy="50"  r="18" fill="url(#nodeGlow)"/>
    <circle cx="820"  cy="265" r="18" fill="url(#nodeGlow)"/>
    <circle cx="970"  cy="220" r="18" fill="url(#nodeGlow)"/>
    <circle cx="1110" cy="275" r="18" fill="url(#nodeGlow)"/>
  </g>

  <!-- traveling cyan messages (short hops along edges) -->
  <g class="msg">
    <circle r="2.4"><animateMotion dur="2.2s" repeatCount="indefinite" path="M 100 50 L 220 115"/></circle>
    <circle r="2.4"><animateMotion dur="2.6s" begin="0.4s" repeatCount="indefinite" path="M 220 115 L 340 45"/></circle>
    <circle r="2.4"><animateMotion dur="2.0s" begin="0.9s" repeatCount="indefinite" path="M 120 230 L 260 275"/></circle>
    <circle r="2.4"><animateMotion dur="2.4s" begin="1.4s" repeatCount="indefinite" path="M 260 275 L 380 200"/></circle>
    <circle r="2.4"><animateMotion dur="2.6s" begin="1.8s" repeatCount="indefinite" path="M 220 115 L 380 200"/></circle>
    <circle r="2.4"><animateMotion dur="2.2s" repeatCount="indefinite" path="M 830 60 L 920 125"/></circle>
    <circle r="2.4"><animateMotion dur="2.6s" begin="0.5s" repeatCount="indefinite" path="M 920 125 L 1090 50"/></circle>
    <circle r="2.4"><animateMotion dur="2.0s" begin="1.0s" repeatCount="indefinite" path="M 820 265 L 970 220"/></circle>
    <circle r="2.4"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M 970 220 L 1110 275"/></circle>
    <circle r="2.4"><animateMotion dur="2.2s" begin="0.9s" repeatCount="indefinite" path="M 920 125 L 970 220"/></circle>
  </g>

  <!-- long amber bridges (slow, deliberate, crossing the title space) -->
  <g class="msg-amber">
    <circle r="3"><animateMotion dur="4.6s" repeatCount="indefinite" path="M 340 45 L 830 60"/></circle>
    <circle r="3"><animateMotion dur="4.6s" begin="2.3s" repeatCount="indefinite" path="M 820 265 L 380 200"/></circle>
  </g>

  <!-- nodes -->
  <g>
    <circle class="node n1"  cx="100"  cy="50"  r="4.5"/>
    <circle class="node n2"  cx="220"  cy="115" r="4.5"/>
    <circle class="node n3"  cx="340"  cy="45"  r="4.5"/>
    <circle class="node n4"  cx="120"  cy="230" r="4.5"/>
    <circle class="node n5"  cx="260"  cy="275" r="4.5"/>
    <circle class="node n6"  cx="380"  cy="200" r="4.5"/>
    <circle class="node n7"  cx="830"  cy="60"  r="4.5"/>
    <circle class="node n8"  cx="920"  cy="125" r="4.5"/>
    <circle class="node n9"  cx="1090" cy="50"  r="4.5"/>
    <circle class="node n10" cx="820"  cy="265" r="4.5"/>
    <circle class="node n11" cx="970"  cy="220" r="4.5"/>
    <circle class="node n12" cx="1110" cy="275" r="4.5"/>
  </g>

  <!-- amber sparkles around the title (4-point stars) -->
  <g class="spark">
    <g transform="translate(450 132)"><path d="M 0 -7 L 1.6 -1.6 L 7 0 L 1.6 1.6 L 0 7 L -1.6 1.6 L -7 0 L -1.6 -1.6 Z" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/>
    </path></g>
    <g transform="translate(760 132)"><path d="M 0 -7 L 1.6 -1.6 L 7 0 L 1.6 1.6 L 0 7 L -1.6 1.6 L -7 0 L -1.6 -1.6 Z" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="0.7s" repeatCount="indefinite"/>
    </path></g>
    <g transform="translate(520 112)"><path d="M 0 -5 L 1.2 -1.2 L 5 0 L 1.2 1.2 L 0 5 L -1.2 1.2 L -5 0 L -1.2 -1.2 Z" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
    </path></g>
    <g transform="translate(680 245)"><path d="M 0 -5 L 1.2 -1.2 L 5 0 L 1.2 1.2 L 0 5 L -1.2 1.2 L -5 0 L -1.2 -1.2 Z" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="1.6s" repeatCount="indefinite"/>
    </path></g>
    <g transform="translate(490 252)"><path d="M 0 -5 L 1.2 -1.2 L 5 0 L 1.2 1.2 L 0 5 L -1.2 1.2 L -5 0 L -1.2 -1.2 Z" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0.3s" repeatCount="indefinite"/>
    </path></g>
    <g transform="translate(720 108)"><path d="M 0 -5 L 1.2 -1.2 L 5 0 L 1.2 1.2 L 0 5 L -1.2 1.2 L -5 0 L -1.2 -1.2 Z" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="1.9s" repeatCount="indefinite"/>
    </path></g>
  </g>

  <!-- eyebrow chip top-left -->
  <g transform="translate(48 32)">
    <rect x="0" y="0" width="138" height="20" rx="3" fill="none" stroke="#22D3EE" stroke-opacity="0.4" stroke-width="0.8"/>
    <text class="eyebrow" x="69" y="14" text-anchor="middle">ORG / PROFILE · v1</text>
  </g>

  <!-- meta tag bottom-right -->
  <text class="meta" x="1152" y="298" text-anchor="end">MIT · MCP-NATIVE · CLAUDE · CODEX · CURSOR</text>

  <!-- title -->
  <text class="title" x="600" y="180" text-anchor="middle">ctxr-dev</text>

  <!-- short cyan accent under the title -->
  <line x1="580" y1="200" x2="620" y2="200" stroke="#22D3EE" stroke-opacity="0.85" stroke-width="1.6"/>

  <!-- subtitle -->
  <text class="subtitle" x="600" y="226" text-anchor="middle">COMPOSABLE TOOLS FOR AI CODING AGENTS</text>

  <!-- terminal prompt with blinking cursor -->
  <g transform="translate(600 262)">
    <text class="term" text-anchor="middle">
      <tspan fill="#22D3EE">$</tspan><tspan fill="#94A3B8" dx="6">npx</tspan><tspan fill="#FAFAFA" dx="6">@ctxr/kit</tspan><tspan class="cursor" fill="#22D3EE" dx="4">▌</tspan>
    </text>
  </g>
</svg>
