<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" role="img" aria-label="Contexter signal trail" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style><![CDATA[
      .bg { fill: #0B1F23; }
      .rule { stroke: #3DBE9C; stroke-opacity: 0.16; stroke-width: 0.6; }
      .label {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 10px; letter-spacing: 0.26em; fill: #5A8F86;
      }
      .hud { stroke: #E5C547; stroke-opacity: 0.55; stroke-width: 1.2; fill: none; }
      @media (prefers-reduced-motion: reduce) { path { animation: none; } }
    ]]></style>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3DBE9C" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#E5C547" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#A05080" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="1200" height="80"/>
  <line class="rule" x1="0" y1="1" x2="1200" y2="1"/>
  <line class="rule" x1="0" y1="79" x2="1200" y2="79"/>

  <g class="hud">
    <path d="M 18 12 L 18 28 M 18 12 L 34 12"/>
    <path d="M 1182 12 L 1182 28 M 1182 12 L 1166 12"/>
    <path d="M 18 68 L 18 52 M 18 68 L 34 68"/>
    <path d="M 1182 68 L 1182 52 M 1182 68 L 1166 68"/>
  </g>

  <!-- horizontal trail line -->
  <line x1="60" y1="40" x2="1140" y2="40" stroke="url(#trail)" stroke-width="1"/>

  <!-- One gold energy packet sliding along the trail (matches hero's edge-energy technique) -->
  <g fill="none" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.95">
    <path d="M 60 40 L 1140 40" pathLength="100" stroke-dasharray="10 100" stroke="#E5C547">
      <animate attributeName="stroke-dashoffset" from="0" to="-110" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M 60 40 L 1140 40" pathLength="100" stroke-dasharray="8 100" stroke="#3DBE9C">
      <animate attributeName="stroke-dashoffset" from="0" to="-108" dur="6s" begin="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 60 40 L 1140 40" pathLength="100" stroke-dasharray="6 100" stroke="#A05080">
      <animate attributeName="stroke-dashoffset" from="0" to="-106" dur="6s" begin="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- centred caption -->
  <text class="label" x="600" y="63" text-anchor="middle">BUILT IN THE OPEN · GITHUB.COM/CTXR-DEV</text>
</svg>
