<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" role="img" aria-label="ctxr-dev signal trail" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style><![CDATA[
      .bg { fill: #0A0B14; }
      .rule { stroke: #22D3EE; stroke-opacity: 0.16; stroke-width: 0.6; }
      .seg { stroke: #A78BFA; stroke-opacity: 0.55; stroke-width: 1; fill: none; }
      .label {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 10px; letter-spacing: 0.26em; fill: #475569;
      }
      .hud { stroke: #22D3EE; stroke-opacity: 0.55; stroke-width: 1.2; fill: none; }
      @media (prefers-reduced-motion: reduce) { circle { animation: none; } }
    ]]></style>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="1200" height="80"/>
  <line class="rule" x1="0" y1="1" x2="1200" y2="1"/>
  <line class="rule" x1="0" y1="79" x2="1200" y2="79"/>

  <!-- corner HUD -->
  <g class="hud">
    <path d="M 18 12 L 18 28 M 18 12 L 34 12"/>
    <path d="M 1182 12 L 1182 28 M 1182 12 L 1166 12"/>
    <path d="M 18 68 L 18 52 M 18 68 L 34 68"/>
    <path d="M 1182 68 L 1182 52 M 1182 68 L 1166 68"/>
  </g>

  <!-- a single thin gradient-stroked horizontal trail across the centre -->
  <line x1="60" y1="40" x2="1140" y2="40" stroke="url(#trail)" stroke-width="1"/>

  <!-- three travelling signal dots -->
  <circle r="2.5" fill="#22D3EE">
    <animateMotion dur="5s" repeatCount="indefinite" path="M 60 40 L 1140 40"/>
  </circle>
  <circle r="2" fill="#A78BFA">
    <animateMotion dur="5s" begin="1.6s" repeatCount="indefinite" path="M 60 40 L 1140 40"/>
  </circle>
  <circle r="2" fill="#FBBF24">
    <animateMotion dur="5s" begin="3.2s" repeatCount="indefinite" path="M 60 40 L 1140 40"/>
  </circle>

  <!-- centred caption -->
  <text class="label" x="600" y="63" text-anchor="middle">BUILT IN THE OPEN · GITHUB.COM/CTXR-DEV</text>
</svg>
